name: secrecon
x-app: &app
  image: secrecon:local
  build: {context: ., target: runtime}
  environment: &environment
    SECRECON_DATABASE_URL: postgresql+psycopg://secrecon:${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}@postgres:5432/secrecon
    SECRECON_REDIS_URL: redis://redis:6379/0
    SECRECON_S3_ENDPOINT: http://object-store:8333
    SECRECON_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run scripts/bootstrap.py}
    SECRECON_S3_SECRET_KEY: ${S3_SECRET_KEY:?Run scripts/bootstrap.py}
    SECRECON_S3_BUCKET: secrecon-raw
    SECRECON_ADMIN_TOKEN: ${SECRECON_ADMIN_TOKEN:-}
    SECRECON_OTLP_ENDPOINT: ${SECRECON_OTLP_ENDPOINT:-}
    SECRECON_SEC_MODE: ${SECRECON_SEC_MODE:-offline}
    SECRECON_SEC_USER_AGENT: ${SECRECON_SEC_USER_AGENT:-}
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: secrecon
      POSTGRES_DB: secrecon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrecon -d secrecon"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  object-store:
    image: chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run scripts/bootstrap.py}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run scripts/bootstrap.py}
    volumes: [object-data:/data]
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  test:
    <<: *app
    image: secrecon:test
    build: {context: ., target: test}
    profiles: [test]
    environment:
      <<: *environment
      SECRECON_OTLP_ENDPOINT: ""
      SECRECON_SEC_MODE: offline
      SECRECON_INTEGRATION: "1"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-store: {condition: service_started}
  worker:
    <<: *app
    command: ["secrecon", "worker"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-store: {condition: service_started}
  scheduler:
    <<: *app
    command: ["secrecon", "dispatch"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  object-data:
