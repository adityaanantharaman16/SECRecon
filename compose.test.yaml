# Always select a separate project: -p secrecon-test
services:
  api:
    profiles: [api]
  object-store:
    # Each test bucket needs collection volumes. Runner disk-based auto sizing
    # otherwise exhausts slots despite the fixtures using very little space.
    command: ["mini", "-dir=/data", "-volume.max=512", "-master.volumeSizeLimitMB=64"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
